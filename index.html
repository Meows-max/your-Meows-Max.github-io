<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作业展示 · 总目录</title>
<style>
  /* ══════════════════════════════════════════════════════════
     作业总目录 —— 导航首页
     新增作业：复制一个 <a class="card"> ... </a> 整块，改标题和链接
     ══════════════════════════════════════════════════════════ */
  :root{
    /* 底色：月白 */
    --bg:          #F5F7F7;
    --surface:     #FFFFFF;
    --surface-2:   #F7FAFA;

    /* 文字：墨青三档 */
    --ink:         #1B2426;
    --ink-2:       #4A585C;
    --ink-3:       #6F7D82;

    /* 分割线 */
    --line:        #DDE5E5;
    --line-soft:   #EAF0EF;

    /* 黛青：主色 */
    --dai:         #2E4A54;
    --dai-2:       #3E6270;
    --dai-line:    rgba(46,74,84,.22);
    --dai-soft:    rgba(46,74,84,.08);

    /* 竹青：辅色 */
    --zhu:         #8FA6A0;
    --zhu-line:    rgba(143,166,160,.48);
    --zhu-soft:    rgba(143,166,160,.16);

    --radius:      14px;
    --maxw:        880px;
  }

  *{ box-sizing:border-box; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:clamp(40px,7vw,84px) clamp(20px,4vw,32px) 64px;
  }

  /* ── 页头 ── */
  .head{ margin-bottom:clamp(36px,5vw,56px); }

  .kicker{
    display:inline-block;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--dai);
    background:var(--dai-soft);
    border:1px solid var(--dai-line);
    border-radius:100px;
    padding:5px 14px;
    margin-bottom:20px;
  }

  h1{
    font-size:clamp(26px,4.2vw,36px);
    line-height:1.28;
    font-weight:600;
    letter-spacing:-.01em;
    margin:0 0 14px;
    color:var(--ink);
  }

  .sub{
    font-size:15px;
    color:var(--ink-3);
    margin:0;
    max-width:34em;
  }

  /* ── 列表 ── */
  .list{
    display:grid;
    gap:14px;
  }

  .card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px clamp(20px,3vw,26px);
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    position:relative;
  }

  .card:hover{
    border-color:var(--dai-line);
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(46,74,84,.07);
  }

  .card:focus-visible{
    outline:2px solid var(--dai-2);
    outline-offset:2px;
  }

  .card-top{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }

  .num{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--zhu);
    border:1px solid var(--zhu-line);
    background:var(--zhu-soft);
    border-radius:100px;
    padding:3px 11px;
    flex:none;
  }

  .card h2{
    font-size:18px;
    font-weight:600;
    margin:0;
    color:var(--ink);
    letter-spacing:-.005em;
  }

  .card p{
    font-size:14px;
    color:var(--ink-3);
    margin:0;
    padding-left:1px;
  }

  .card .arrow{
    position:absolute;
    right:clamp(20px,3vw,26px);
    top:50%;
    transform:translateY(-50%);
    color:var(--zhu);
    font-size:18px;
    line-height:1;
    transition:transform .18s ease, color .18s ease;
  }

  .card:hover .arrow{
    transform:translateY(-50%) translateX(3px);
    color:var(--dai);
  }

  /* 待补位 */
  .card.draft{
    background:var(--surface-2);
    border-style:dashed;
    border-color:var(--line);
    cursor:default;
  }

  .card.draft .num{ color:var(--ink-3); border-color:var(--line); background:transparent; }
  .card.draft h2{ color:var(--ink-3); font-weight:500; }
  .card.draft:hover{ transform:none; box-shadow:none; border-color:var(--line); }
  .card.draft .arrow{ display:none; }

  /* ── 页脚 ── */
  footer{
    margin-top:clamp(40px,6vw,64px);
    padding-top:22px;
    border-top:1px solid var(--line-soft);
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--ink-3);
  }

  @media (max-width:520px){
    .card .arrow{ display:none; }
    .card-top{ gap:9px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <span class="kicker">课程作业 · 总目录</span>
    <h1>作业展示</h1>
    <p class="sub">按顺序排列的课程作业。点击卡片进入对应作品。</p>
  </header>

  <main class="list">

    <!-- ═══ 第一次作业 ═══ 复制这一整块来新增作业 -->
    <a class="card" href="homework-1/">
      <div class="card-top">
        <span class="num">01</span>
        <h2>第一次作业 · 作业展示网页</h2>
      </div>
      <p>课程作业展示页面</p>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <!-- ═══ 待补位示例（有内容后删掉本块） ═══ -->
    <div class="card draft">
      <div class="card-top">
        <span class="num">02</span>
        <h2>第二次作业 · 待添加</h2>
      </div>
      <p>把新作业放进 homework-2 文件夹后，替换上面的链接</p>
    </div>

  </main>

  <footer>
    <span>课程作业展示</span>
    <span>更新于 2026 年 10 月</span>
  </footer>

</div>
</body>
</html>
